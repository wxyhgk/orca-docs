name: docs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material mkdocs-static-i18n
      # site_dir on CLI is resolved relative to cwd (repo root)
      - name: Build
        run: mkdocs build -f docs-site/mkdocs.yml -d "$GITHUB_WORKSPACE/site_out"
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site_out
