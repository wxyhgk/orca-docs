name: docs
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material mkdocs-static-i18n
      - name: Build
        run: mkdocs build -f docs-site/mkdocs.yml -d "$GITHUB_WORKSPACE/site_out"
      - name: Deploy to main site doc/orca
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: wxyhgk/wxyhgk.github.io
          publish_branch: master
          publish_dir: ./site_out
          destination_dir: doc/orca
          keep_files: true
