markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mathjax/tex-mml-chtml.js
  - javascripts/math-instant.js
  - javascripts/fast-mol-viewer.iife.js
  - javascripts/mol-embed.js
  - javascripts/tabs-pin.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/mol-embed.css

