site_name: ORCA 6.1 Tutorials
site_description: ORCA 量子化学教程 / Quantum chemistry tutorials
site_url: ""
use_directory_urls: true

docs_dir: docs
site_dir: site

hooks:
  - hooks/mol_fence.py

# mol fence handled by hook preprocessor (hooks/mol_fence.py)

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  logo: assets/fastmol-logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
